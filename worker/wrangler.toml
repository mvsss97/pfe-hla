name = "pfe-hla-bot"
main = "src/index.js"
compatibility_date = "2024-09-01"

[vars]
SITE_URL = "https://pfe-hla.pages.dev"

# Secrets (never in this file): set them with `wrangler secret put NAME`
#   TELEGRAM_BOT_TOKEN, TELEGRAM_PAIRING_CODE, TELEGRAM_WEBHOOK_SECRET, PIPELINE_SECRET,
#   GEMINI_API_KEY (free key: French translation in the PDF reader)

# One tick every 30 minutes: the worker sends the slots of its SCHEDULE
# (08:00, 10:00, 13:00, 15:30, 18:00, 20:00 Africa/Algiers, UTC+1 without DST)
# and the AI-security alerts held during quiet hours.
[triggers]
crons = ["*/30 * * * *"]

# KV namespace for state (chat_id, queued decisions, lesson progress, settings)
[[kv_namespaces]]
binding = "PFE_STATE"
id = "3f642efa5e364d08ae56481e993399d4"

[observability]
enabled = true
