name: daily research companion

on:
  workflow_dispatch:
  push:
    branches: [master]
  schedule:
    # 19:00 in Africa/Algiers (UTC+1)
    - cron: "0 18 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
      # Add URL so digest points here
      PFE_SITE_URL: "https://mvsss97.github.io/pfe-hla/"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -e .

      - name: Restore the research database
        uses: actions/cache@v4
        with:
          path: data/pfe_hla.db
          key: research-db-${{ github.run_id }}
          restore-keys: research-db-

      # Fetch decisions from Telegram Bot (Cloudflare KV)
      - name: Fetch and apply manual screening decisions
        run: python -m pfe_hla sync-decisions || true
        env:
          WORKER_URL: "https://pfe-hla-bot.massiresacko97.workers.dev"
          WORKER_SECRET: ${{ secrets.TELEGRAM_PAIRING_CODE }}

      - name: Initialize curated data
        run: python -m pfe_hla init --seed

      - name: Collect scholarly metadata
        continue-on-error: true
        run: python -m pfe_hla collect --limit 20 --run-kind watch

      - name: Deduplicate
        run: python -m pfe_hla dedupe --apply || true

      - name: Export the public dashboard state
        run: python -m pfe_hla export

      - name: Send the daily Telegram digest
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_ALLOWED_CHAT_ID != '' }}
        run: python -m pfe_hla digest --read-only

      # Deploy to GitHub Pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
