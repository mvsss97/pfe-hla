name: daily research companion

on:
  workflow_dispatch:
  schedule:
    # 19:00 in Africa/Algiers (UTC+1)
    - cron: "0 18 * * *"

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      OPENALEX_EMAIL: ${{ secrets.OPENALEX_EMAIL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
      PFE_SITE_URL: ${{ vars.PFE_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -e .

      - name: Restore the research database
        uses: actions/cache@v4
        with:
          path: data/pfe_hla.db
          key: research-db-${{ github.run_id }}
          restore-keys: research-db-

      - name: Initialize curated data
        run: python -m pfe_hla init --seed

      - name: Collect scholarly metadata
        continue-on-error: true
        run: python -m pfe_hla collect --limit 20 --run-kind watch

      - name: Deduplicate
        run: python -m pfe_hla dedupe --apply || true

      - name: Export the public dashboard state
        run: python -m pfe_hla export

      - name: Send the daily Telegram digest
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_ALLOWED_CHAT_ID != '' }}
        run: python -m pfe_hla digest --read-only

      # Deploy to Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=pfe-hla --branch=main
